<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Citrus Cure — Plant Pathology & Diagnostics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --lime: #B8E827;
      --ink: #111C20;
      --muted: #55656A;
      --surface: #F3F5EF;
      --card: #FFFFFF;
      --line: rgba(17, 28, 32, 0.09);
      --ok: #16A34A;
      --warn: #D97706;
      --warn-bg: #FEF3C7;
      --bad: #DC2626;
      --bad-bg: #FFE4E6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: var(--lime);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      padding: clamp(6px, 1.1vw, 14px);
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .shell {
      width: 100%;
      max-width: 1360px;
      background: var(--surface);
      border-radius: clamp(18px, 2.2vw, 28px);
      padding: clamp(10px, 1.3vw, 16px);
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: clamp(10px, 1.3vw, 16px);
      box-shadow: 0 18px 48px rgba(17, 28, 32, 0.16);
      position: relative;
    }

    /* Desktop / Landscape Tablet / Kiosk: lock cleanly to viewport */
    @media (min-width: 860px) and (min-aspect-ratio: 11/10) {
      html, body {
        height: 100dvh;
        overflow: hidden;
      }
      .shell {
        height: 100%;
        overflow: hidden;
      }
      .details-card {
        min-height: 0;
      }
      .detail-v {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .details-card.has-more .detail-row:last-of-type .detail-v {
        padding-right: 92px;
      }
    }

    /* Mobile / Portrait Tablet: comfortable scrollable stack */
    @media (max-width: 859px), (max-aspect-ratio: 11/10) {
      body {
        padding: 8px;
      }
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }
      .viewport {
        aspect-ratio: 4 / 3;
        min-height: 220px;
        max-height: 46dvh;
      }
      .panel {
        grid-template-rows: auto auto auto auto;
      }
      .action-bar {
        position: sticky;
        bottom: 4px;
        z-index: 10;
        background: rgba(243, 245, 239, 0.9);
        backdrop-filter: blur(8px);
        padding-top: 6px;
        border-radius: 20px;
      }
    }

    /* Left: Camera / Image Dropzone Viewport */
    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: var(--ink);
      border-radius: clamp(14px, 1.8vw, 22px);
      overflow: hidden;
    }
    .viewport.dragover {
      outline: 3px dashed var(--lime);
      outline-offset: -6px;
    }

    #camVideo, #previewImg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #previewImg { display: none; }

    .cam-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      color: #E2E8F0;
      background: radial-gradient(circle at center, #1b2c32 0%, #111C20 100%);
    }
    .cam-fallback.visible { display: flex; }
    .cam-fallback p {
      font-size: 14px;
      color: #94A3B8;
      max-width: 280px;
      line-height: 1.45;
    }
    .upload-cta {
      border: none;
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 11px 20px;
      cursor: pointer;
    }

    .cam-tools {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 6;
    }
    .cam-pill-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(17, 28, 32, 0.72);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease;
    }
    .cam-pill-btn:hover { background: rgba(17, 28, 32, 0.9); }

    .frame-marks {
      position: absolute;
      inset: clamp(16px, 3vw, 28px);
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .viewport.busy .frame-marks {
      opacity: 1;
      transform: scale(0.97);
    }
    .corner {
      position: absolute;
      width: clamp(16px, 2.4vw, 24px);
      height: clamp(16px, 2.4vw, 24px);
      border-color: var(--lime);
      border-style: solid;
      border-width: 0;
    }
    .c-tl { top: 0; left: 0; border-top-width: 2.5px; border-left-width: 2.5px; border-top-left-radius: 8px; }
    .c-tr { top: 0; right: 0; border-top-width: 2.5px; border-right-width: 2.5px; border-top-right-radius: 8px; }
    .c-bl { bottom: 0; left: 0; border-bottom-width: 2.5px; border-left-width: 2.5px; border-bottom-left-radius: 8px; }
    .c-br { bottom: 0; right: 0; border-bottom-width: 2.5px; border-right-width: 2.5px; border-bottom-right-radius: 8px; }

    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #FFFFFF;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease-out;
    }
    .shutter-flash.flash { opacity: 0.8; transition: none; }

    .shot-thumb {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 76px;
      height: 48px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    /* Right: Diagnostic Panel */
    .panel {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: clamp(8px, 1.1vh, 11px);
      min-height: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 2px 2px 0;
    }
    .brand {
      font-size: clamp(18px, 2.3vw, 24px);
      font-weight: 800;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .lang-seg {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.2;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-btn.active {
      background: var(--ink);
      color: #FFFFFF;
    }
    .lang-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #CBD5E1;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(22, 163, 74, 0.65); }
    .status-dot.deficiency { background: var(--warn); box-shadow: 0 0 8px rgba(217, 119, 6, 0.72); }
    .status-dot.bad { background: var(--bad); box-shadow: 0 0 8px rgba(220, 38, 38, 0.65); }

    .mini-toggle {
      height: 31px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .mini-toggle.on {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    /* Shimmer Loading State */
    .hero-card, .details-card {
      position: relative;
      overflow: hidden;
    }
    .is-loading .hero-content,
    .is-loading .details-content {
      opacity: 0.28;
      transition: opacity 0.18s ease;
    }
    .hero-content, .details-content {
      transition: opacity 0.22s ease;
    }

    .shimmer-bar {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(105deg, transparent 25%, rgba(255, 255, 255, 0.55) 50%, transparent 75%);
      transform: translateX(-100%);
    }
    .is-loading .shimmer-bar {
      opacity: 1;
      animation: shimmerSweep 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes shimmerSweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .loader-pill {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.94);
      background: var(--ink);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(17, 28, 32, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 5;
      white-space: nowrap;
    }
    .is-loading .loader-pill {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .arc-spinner {
      width: 18px;
      height: 18px;
      animation: spinArc 0.78s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spinArc {
      to { transform: rotate(360deg); }
    }

    /* Hero Card + Diagnostic Status LEDs */
    .hero-card {
      background: var(--card);
      border-radius: clamp(14px, 1.8vw, 20px);
      padding: clamp(11px, 1.5vh, 15px) clamp(12px, 1.6vw, 18px);
      border: 1px solid var(--line);
      transition: background 0.25s ease;
    }
    .hero-card.ok { background: var(--lime); border-color: transparent; }
    .hero-card.deficiency { background: var(--warn-bg); border-color: rgba(217, 119, 6, 0.28); }
    .hero-card.bad { background: var(--bad-bg); border-color: rgba(220, 38, 38, 0.18); }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.1vh, 11px);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hero-titles {
      min-width: 180px;
      flex: 1;
    }
    .plant-title {
      font-size: clamp(19px, 2.5vw, 26px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }
    .plant-latin {
      font-size: clamp(12px, 1.4vw, 14px);
      font-weight: 600;
      font-style: italic;
      color: var(--muted);
      margin-top: 2px;
    }

    .led-bank {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .led-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      transition: all 0.18s ease;
    }
    .led-bulb {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #CBD5E1;
      border: 1px solid rgba(17, 28, 32, 0.15);
      transition: all 0.18s ease;
    }
    .led-chip.on {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }
    .led-chip[data-color="yellow"].on .led-bulb {
      background: #FACC15;
      border-color: #FEF08A;
      box-shadow: 0 0 10px #FACC15;
    }
    .led-chip[data-color="green"].on .led-bulb {
      background: #22C55E;
      border-color: #86EFAC;
      box-shadow: 0 0 10px #22C55E;
    }
    .led-chip[data-color="red"].on .led-bulb {
      background: #EF4444;
      border-color: #FCA5A5;
      box-shadow: 0 0 10px #EF4444;
    }

    .facts-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .fact-chip {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 10px;
      padding: 5px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .fact-k {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .fact-v {
      font-size: clamp(12.5px, 1.6vw, 14.5px);
      font-weight: 800;
      color: var(--ink);
    }

    /* Details Card */
    .details-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: clamp(14px, 1.8vw, 20px);
      padding: clamp(10px, 1.5vh, 15px) clamp(12px, 1.6vw, 18px);
      display: flex;
      flex-direction: column;
    }
    .details-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 8px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      align-items: baseline;
      font-size: clamp(13.5px, 1.7vw, 16px);
      line-height: 1.42;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }
    @media (max-width: 460px) {
      .detail-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
    .detail-row:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }
    .detail-k {
      font-size: clamp(10.5px, 1.25vw, 12px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .detail-v {
      font-weight: 600;
      color: var(--ink);
    }

    .read-more-btn {
      position: absolute;
      right: 10px;
      bottom: 8px;
      display: none;
      align-items: center;
      gap: 5px;
      background: var(--ink);
      color: var(--lime);
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(17, 28, 32, 0.28);
      z-index: 4;
    }
    .read-more-btn.visible { display: inline-flex; }

    /* Error Notice */
    .error-banner {
      display: none;
      background: var(--bad-bg);
      color: #991B1B;
      border: 1px solid rgba(220, 38, 38, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 600;
    }
    .error-banner.visible { display: block; }

    /* Action Bar */
    .action-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .capture-btn {
      flex: 1;
      height: clamp(48px, 7.6vh, 56px);
      border: none;
      border-radius: 18px;
      background: var(--ink);
      color: #FFFFFF;
      font-family: inherit;
      font-size: clamp(15px, 2vw, 17px);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .capture-btn:active { transform: scale(0.98); }
    .capture-btn:disabled { opacity: 0.72; cursor: wait; }

    .shutter-ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid var(--lime);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--lime);
    }

    .speak-btn {
      width: clamp(48px, 7.6vh, 56px);
      height: clamp(48px, 7.6vh, 56px);
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }
    .speak-btn:active { transform: scale(0.95); }
    .speak-btn:disabled { opacity: 0.4; cursor: default; }

    /* Full Scrollable Report Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 28, 32, 0.58);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 22px);
      z-index: 40;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 760px;
      height: min(90dvh, 520px);
      background: var(--card);
      border-radius: 22px;
      padding: clamp(12px, 2vw, 20px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }
    .modal-title {
      font-size: clamp(20px, 2.8vw, 26px);
      font-weight: 800;
      line-height: 1.15;
    }
    .modal-sub {
      font-size: 13px;
      font-style: italic;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }
    .modal-body {
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }
    .modal-item {
      background: var(--surface);
      border-radius: 14px;
      padding: 11px 14px;
      flex-shrink: 0;
    }
    .modal-k {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal-v {
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 600;
      line-height: 1.45;
      color: var(--ink);
    }
    .modal-foot { display: flex; gap: 8px; }
    .modal-close {
      flex: 1;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: var(--ink);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-speak {
      width: 56px;
      height: 46px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="viewport" id="viewport">
      <video id="camVideo" autoplay playsinline muted></video>
      <img id="previewImg" alt="Selected Plant Photo" />

      <div class="cam-fallback" id="camFallback">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#B8E827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <p id="camFallbackText">Allow camera access or upload/drop a plant photo to diagnose.</p>
        <button class="upload-cta" type="button" onclick="triggerUpload()">Choose Photo</button>
      </div>

      <div class="cam-tools">
        <button class="cam-pill-btn" id="flipCamBtn" type="button" onclick="flipCamera()" style="display:none;">Flip</button>
        <button class="cam-pill-btn" id="liveCamBtn" type="button" onclick="resumeLiveCamera()" style="display:none;">Live Cam</button>
        <button class="cam-pill-btn" type="button" onclick="triggerUpload()">Upload</button>
      </div>

      <div class="frame-marks">
        <div class="corner c-tl"></div>
        <div class="corner c-tr"></div>
        <div class="corner c-bl"></div>
        <div class="corner c-br"></div>
      </div>

      <div class="shutter-flash" id="shutterFlash"></div>
      <img id="shotThumb" class="shot-thumb" alt="Last Captured Photo" />
    </div>

    <div class="panel" id="rightPanel">
      <div class="topbar">
        <div class="brand">Citrus Cure</div>
        <div class="top-actions">
          <div class="lang-seg" role="group" aria-label="Language">
            <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
          </div>
          <div class="status-pill">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
          </div>
          <button class="mini-toggle on" id="voiceBtn" onclick="toggleVoice()">Voice</button>
        </div>
      </div>

      <div class="hero-card" id="heroCard">
        <div class="hero-content">
          <div class="hero-top">
            <div class="hero-titles">
              <div class="plant-title" id="plantName">Ready to Diagnose</div>
              <div class="plant-latin" id="sciName">Point camera at a leaf or upload a photo</div>
            </div>
            <div class="led-bank" aria-label="Diagnostic Indicator LEDs">
              <div class="led-chip" id="uiLed-deficiency" data-color="yellow" title="Yellow: Nutrient Deficiency">
                <span class="led-bulb"></span><span id="lblLed1">Deficiency</span>
              </div>
              <div class="led-chip" id="uiLed-ok" data-color="green" title="Green: Healthy">
                <span class="led-bulb"></span><span id="lblLed2">Healthy</span>
              </div>
              <div class="led-chip" id="uiLed-bad" data-color="red" title="Red: Disease / Pest">
                <span class="led-bulb"></span><span id="lblLed3">Disease</span>
              </div>
            </div>
          </div>

          <div class="facts-row">
            <div class="fact-chip">
              <span class="fact-k" id="lblType">Type</span>
              <span class="fact-v" id="catVal">—</span>
            </div>
            <div class="fact-chip">
              <span class="fact-k" id="lblSev">Severity</span>
              <span class="fact-v" id="sevVal">—</span>
            </div>
            <div class="fact-chip">
              <span class="fact-k" id="lblPart">Part</span>
              <span class="fact-v" id="partVal">—</span>
            </div>
          </div>
        </div>
        <div class="shimmer-bar"></div>
      </div>

      <div class="details-card" id="detailsCard">
        <div class="details-content">
          <div class="detail-row">
            <div class="detail-k" id="lblCond">Condition</div>
            <div class="detail-v" id="condVal">—</div>
          </div>
          <div class="detail-row">
            <div class="detail-k" id="lblSymp">Symptoms</div>
            <div class="detail-v" id="sympVal">—</div>
          </div>
          <div class="detail-row">
            <div class="detail-k" id="lblCause">Cause</div>
            <div class="detail-v" id="causeVal">—</div>
          </div>
          <div class="detail-row">
            <div class="detail-k" id="lblTreat">Treatment</div>
            <div class="detail-v" id="treatVal">—</div>
          </div>
        </div>
        <div class="shimmer-bar"></div>
        <div class="loader-pill" id="loaderPill">
          <svg class="arc-spinner" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
            <path d="M12 3a9 9 0 0 1 9 9" stroke="#B8E827" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span id="loaderText">Loading...</span>
        </div>
        <button class="read-more-btn" id="readMoreBtn" onclick="openModal()">Read more</button>
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="action-bar">
        <button class="capture-btn" id="captureBtn" onclick="captureAndDiagnose()">
          <span class="shutter-ring"><span class="shutter-core"></span></span>
          <span id="captureLabel">Capture & Diagnose</span>
        </button>
        <button class="speak-btn" id="speakBtn" onclick="speakReport()" disabled aria-label="Speak Diagnosis">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Full Scrollable Report Modal -->
    <div class="modal-backdrop" id="fullModal" onclick="if (event.target === this) closeModal()">
      <div class="modal-sheet">
        <div class="modal-head">
          <div>
            <div class="modal-title" id="mPlantName">—</div>
            <div class="modal-sub" id="mSciName">—</div>
          </div>
          <div class="status-pill">
            <span class="status-dot" id="mStatusDot"></span>
            <span id="mStatusText">—</span>
          </div>
        </div>
        <div class="modal-body" id="modalBody">
          <div class="modal-item">
            <div class="modal-k" id="mLblCond">Condition</div>
            <div class="modal-v" id="mCondVal">—</div>
          </div>
          <div class="modal-item">
            <div class="modal-k" id="mLblSymp">Symptoms</div>
            <div class="modal-v" id="mSympVal">—</div>
          </div>
          <div class="modal-item">
            <div class="modal-k" id="mLblCause">Cause</div>
            <div class="modal-v" id="mCauseVal">—</div>
          </div>
          <div class="modal-item">
            <div class="modal-k" id="mLblTreat">Treatment</div>
            <div class="modal-v" id="mTreatVal">—</div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="modal-close" id="modalCloseBtn" onclick="closeModal()">Close</button>
          <button class="modal-speak" id="modalSpeakBtn" onclick="speakReport()" aria-label="Speak Diagnosis">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <input id="fileInput" type="file" accept="image/*" style="display:none;" />
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    const UI_STRINGS = {
      en: {
        ready: "Ready", analyzing: "Analyzing", translating: "Translating",
        translatingMsg: "Translating to English...", analyzingMsg: "Diagnosing plant...",
        healthy: "Healthy", deficiency: "Deficiency", infected: "Infected", noPlant: "No Plant",
        idleTitle: "Ready to Diagnose", idleSub: "Point camera at a leaf or upload a photo",
        capture: "Capture & Diagnose", analyzeUploaded: "Diagnose Photo", diagnosing: "Diagnosing...", voice: "Voice",
        type: "Type", severity: "Severity", part: "Part",
        condition: "Condition", symptoms: "Symptoms", cause: "Cause", treatment: "Treatment",
        readMore: "Read more", close: "Close",
        led1: "Deficiency", led2: "Healthy", led3: "Disease"
      },
      hi: {
        ready: "तैयार", analyzing: "जांच जारी", translating: "अनुवाद जारी",
        translatingMsg: "हिंदी में अनुवाद हो रहा है...", analyzingMsg: "पौधे की जांच हो रही है...",
        healthy: "स्वस्थ", deficiency: "पोषण कमी", infected: "संक्रमित", noPlant: "पौधा नहीं",
        idleTitle: "जांच के लिए तैयार", idleSub: "पत्ते के सामने कैमरा रखें या फ़ोटो अपलोड करें",
        capture: "फ़ोटो खींचें और जांचें", analyzeUploaded: "फ़ोटो जांचें", diagnosing: "जांच हो रही है...", voice: "आवाज़",
        type: "प्रकार", severity: "गंभीरता", part: "हिस्सा",
        condition: "स्थिति", symptoms: "लक्षण", cause: "कारण", treatment: "उपचार",
        readMore: "पूरा पढ़ें", close: "बंद करें",
        led1: "पोषण कमी", led2: "स्वस्थ", led3: "रोग"
      }
    };

    const video = document.getElementById("camVideo");
    const previewImg = document.getElementById("previewImg");
    const camFallback = document.getElementById("camFallback");
    const viewport = document.getElementById("viewport");
    const rightPanel = document.getElementById("rightPanel");
    const shotThumb = document.getElementById("shotThumb");
    const fileInput = document.getElementById("fileInput");
    const captureCanvas = document.getElementById("captureCanvas");
    const errorBanner = document.getElementById("errorBanner");

    let currentLang = localStorage.getItem("citrus_lang") || "en";
    if (!UI_STRINGS[currentLang]) currentLang = "en";

    let facingMode = "environment";
    let activeStream = null;
    let cameraReady = false;
    let uploadedDataUrl = null;
    let voiceEnabled = true;
    let inFlight = false;
    let hasResult = false;
    let lastStatus = "idle";
    let currentSummary = "";
    let currentTone = "neutral";
    let reportCacheByLang = {};
    let currentReport = null;
    const audioPlayer = new Audio();
    let lastAudioUrl = null;

    function showError(msg) {
      if (!msg) {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
      } else {
        errorBanner.textContent = msg;
        errorBanner.classList.add("visible");
      }
    }

    function updateLedIndicators(status) {
      document.getElementById("uiLed-deficiency").classList.toggle("on", status === "deficiency");
      document.getElementById("uiLed-ok").classList.toggle("on", status === "ok");
      document.getElementById("uiLed-bad").classList.toggle("on", status === "bad");
    }

    function setLoadingState(active, loaderMessage = "") {
      rightPanel.classList.toggle("is-loading", active);
      document.getElementById("captureBtn").disabled = active;
      document.querySelectorAll(".lang-btn").forEach((b) => { b.disabled = active; });
      if (loaderMessage) document.getElementById("loaderText").textContent = loaderMessage;
    }

    function applyUIStrings(customStatus = null) {
      const t = UI_STRINGS[currentLang];
      document.querySelectorAll(".lang-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.lang === currentLang);
        b.disabled = inFlight;
      });
      document.getElementById("voiceBtn").textContent = t.voice;
      document.getElementById("lblType").textContent = t.type;
      document.getElementById("lblSev").textContent = t.severity;
      document.getElementById("lblPart").textContent = t.part;
      document.getElementById("lblCond").textContent = t.condition;
      document.getElementById("lblSymp").textContent = t.symptoms;
      document.getElementById("lblCause").textContent = t.cause;
      document.getElementById("lblTreat").textContent = t.treatment;
      document.getElementById("mLblCond").textContent = t.condition;
      document.getElementById("mLblSymp").textContent = t.symptoms;
      document.getElementById("mLblCause").textContent = t.cause;
      document.getElementById("mLblTreat").textContent = t.treatment;
      document.getElementById("readMoreBtn").textContent = t.readMore;
      document.getElementById("modalCloseBtn").textContent = t.close;
      document.getElementById("lblLed1").textContent = t.led1;
      document.getElementById("lblLed2").textContent = t.led2;
      document.getElementById("lblLed3").textContent = t.led3;

      const actionLbl = uploadedDataUrl ? t.analyzeUploaded : t.capture;
      document.getElementById("captureLabel").textContent = inFlight ? t.diagnosing : actionLbl;

      if (!hasResult) {
        document.getElementById("plantName").textContent = t.idleTitle;
        document.getElementById("sciName").textContent = t.idleSub;
      }
      const statusMap = {
        idle: t.ready,
        ok: t.healthy,
        deficiency: t.deficiency,
        bad: t.infected,
        none: t.noPlant
      };
      document.getElementById("statusText").textContent = customStatus || (inFlight ? t.analyzing : (statusMap[lastStatus] || t.ready));
      checkOverflow();
    }

    function checkOverflow() {
      const card = document.getElementById("detailsCard");
      const btn = document.getElementById("readMoreBtn");
      btn.classList.remove("visible");
      card.classList.remove("has-more");

      // Only clamp and show Read More on desktop/landscape locked viewport
      if (window.innerWidth < 860 || window.innerWidth / window.innerHeight < 1.1) return;

      const measure = () => {
        let overflowed = card.scrollHeight > card.clientHeight + 2;
        if (!overflowed) {
          card.querySelectorAll(".detail-v").forEach((el) => {
            if (el.scrollHeight > el.clientHeight + 2) overflowed = true;
          });
        }
        if (hasResult && overflowed) {
          card.classList.add("has-more");
          btn.classList.add("visible");
        }
      };

      requestAnimationFrame(() => {
        measure();
        setTimeout(measure, 70);
      });
    }

    function syncModalContent() {
      document.getElementById("mPlantName").textContent = document.getElementById("plantName").textContent;
      document.getElementById("mSciName").textContent = document.getElementById("sciName").textContent;
      document.getElementById("mStatusText").textContent = document.getElementById("statusText").textContent;
      document.getElementById("mStatusDot").className = document.getElementById("statusDot").className;
      document.getElementById("mCondVal").textContent = document.getElementById("condVal").textContent;
      document.getElementById("mSympVal").textContent = document.getElementById("sympVal").textContent;
      document.getElementById("mCauseVal").textContent = document.getElementById("causeVal").textContent;
      document.getElementById("mTreatVal").textContent = document.getElementById("treatVal").textContent;
      document.getElementById("modalSpeakBtn").disabled = !currentSummary;
    }

    function openModal() {
      syncModalContent();
      document.getElementById("modalBody").scrollTop = 0;
      document.getElementById("fullModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("fullModal").classList.remove("open");
    }

    async function startCamera() {
      if (activeStream) {
        activeStream.getTracks().forEach((tr) => tr.stop());
        activeStream = null;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        cameraReady = false;
        camFallback.classList.add("visible");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        activeStream = stream;
        video.srcObject = stream;
        cameraReady = true;
        camFallback.classList.remove("visible");
        document.getElementById("flipCamBtn").style.display = "inline-flex";
      } catch (err) {
        cameraReady = false;
        camFallback.classList.add("visible");
      }
    }

    function flipCamera() {
      facingMode = facingMode === "environment" ? "user" : "environment";
      resumeLiveCamera();
      startCamera();
    }

    function resumeLiveCamera() {
      uploadedDataUrl = null;
      previewImg.style.display = "none";
      previewImg.src = "";
      document.getElementById("liveCamBtn").style.display = "none";
      if (!cameraReady) {
        camFallback.classList.add("visible");
      }
      applyUIStrings();
    }

    function triggerUpload() {
      fileInput.click();
    }

    function encodeImageToJpeg(imgEl, maxDim = 768, quality = 0.84) {
      const w = imgEl.naturalWidth || imgEl.videoWidth;
      const h = imgEl.naturalHeight || imgEl.videoHeight;
      if (!w || !h) return null;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      captureCanvas.width = Math.round(w * scale);
      captureCanvas.height = Math.round(h * scale);
      captureCanvas.getContext("2d").drawImage(imgEl, 0, 0, captureCanvas.width, captureCanvas.height);
      return captureCanvas.toDataURL("image/jpeg", quality);
    }

    function handleImageFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      showError("");
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const compressed = encodeImageToJpeg(img, 768, 0.84);
          if (!compressed) return;
          uploadedDataUrl = compressed;
          previewImg.src = compressed;
          previewImg.style.display = "block";
          camFallback.classList.remove("visible");
          document.getElementById("liveCamBtn").style.display = cameraReady ? "inline-flex" : "none";
          applyUIStrings();
          captureAndDiagnose(compressed);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleImageFile(file);
      fileInput.value = "";
    });

    viewport.addEventListener("dragover", (e) => {
      e.preventDefault();
      viewport.classList.add("dragover");
    });
    viewport.addEventListener("dragleave", () => viewport.classList.remove("dragover"));
    viewport.addEventListener("drop", (e) => {
      e.preventDefault();
      viewport.classList.remove("dragover");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleImageFile(file);
    });

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById("voiceBtn").classList.toggle("on", voiceEnabled);
      if (!voiceEnabled) {
        audioPlayer.pause();
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      }
    }

    function triggerShutterFlash() {
      const flash = document.getElementById("shutterFlash");
      flash.classList.add("flash");
      requestAnimationFrame(() => setTimeout(() => flash.classList.remove("flash"), 35));
    }

    async function captureAndDiagnose(forcedDataUrl = null) {
      if (inFlight) return;
      showError("");

      const dataUrl = forcedDataUrl || uploadedDataUrl || (cameraReady ? encodeImageToJpeg(video, 768, 0.84) : null);
      if (!dataUrl) {
        triggerUpload();
        return;
      }

      inFlight = true;
      closeModal();
      reportCacheByLang = {};
      const t = UI_STRINGS[currentLang];

      viewport.classList.add("busy");
      setLoadingState(true, t.analyzingMsg);
      applyUIStrings(t.analyzing);
      triggerShutterFlash();
      shotThumb.src = dataUrl;
      shotThumb.style.display = "block";

      try {
        const res = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: dataUrl, language: currentLang })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Diagnosis failed");
        reportCacheByLang[currentLang] = data;
        renderReport(data, true);
      } catch (err) {
        console.error(err);
        showError(err.message || "Diagnosis failed. Check Cloudflare environment variables.");
      } finally {
        inFlight = false;
        viewport.classList.remove("busy");
        setLoadingState(false);
        applyUIStrings();
      }
    }

    async function setLanguage(lang) {
      if (!UI_STRINGS[lang] || inFlight || lang === currentLang) return;
      const prevLang = currentLang;
      currentLang = lang;
      localStorage.setItem("citrus_lang", lang);
      showError("");

      if (!hasResult || !currentReport) {
        applyUIStrings();
        return;
      }

      if (reportCacheByLang[lang]) {
        renderReport(reportCacheByLang[lang], true);
        return;
      }

      inFlight = true;
      setLoadingState(true, UI_STRINGS[lang].translatingMsg);
      applyUIStrings(UI_STRINGS[lang].translating);
      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ report: currentReport, language: lang })
        });
        const translated = await res.json();
        if (!res.ok) throw new Error(translated.error || "Translation failed");
        reportCacheByLang[lang] = translated;
        renderReport(translated, true);
      } catch (err) {
        console.error(err);
        showError(err.message || "Translation failed.");
        currentLang = prevLang;
        localStorage.setItem("citrus_lang", prevLang);
      } finally {
        inFlight = false;
        setLoadingState(false);
        applyUIStrings();
      }
    }

    function renderReport(data, shouldAutoSpeak = true) {
      hasResult = true;
      currentReport = data;
      lastStatus = data.status || "none";
      const t = UI_STRINGS[data.language || currentLang] || UI_STRINGS.en;

      const hero = document.getElementById("heroCard");
      const dot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");

      hero.classList.remove("ok", "deficiency", "bad");
      dot.classList.remove("ok", "deficiency", "bad");

      if (data.status === "ok") {
        hero.classList.add("ok");
        dot.classList.add("ok");
        statusText.textContent = t.healthy;
      } else if (data.status === "deficiency") {
        hero.classList.add("deficiency");
        dot.classList.add("deficiency");
        statusText.textContent = t.deficiency;
      } else if (data.status === "bad") {
        hero.classList.add("bad");
        dot.classList.add("bad");
        statusText.textContent = t.infected;
      } else {
        statusText.textContent = t.noPlant;
      }

      updateLedIndicators(lastStatus);

      document.getElementById("plantName").textContent = data.plant_name || "Unknown";
      document.getElementById("sciName").textContent = data.scientific_name || "-";
      document.getElementById("catVal").textContent = data.category || "—";
      document.getElementById("sevVal").textContent = data.severity || "—";
      document.getElementById("partVal").textContent = data.affected_part || "—";
      document.getElementById("condVal").textContent = data.condition || "—";
      document.getElementById("sympVal").textContent = data.symptoms || "—";
      document.getElementById("causeVal").textContent = data.causal_agent || "—";
      document.getElementById("treatVal").textContent = data.treatment || "—";

      currentSummary = data.spoken_summary || "";
      currentTone = data.status === "ok" ? "ok" : "bad";
      document.getElementById("speakBtn").disabled = !currentSummary;

      if (document.getElementById("fullModal").classList.contains("open")) {
        syncModalContent();
      }

      applyUIStrings();
      checkOverflow();

      if (shouldAutoSpeak && voiceEnabled && data.plant_detected && currentSummary) {
        speakReport();
      }
    }

    function speakWithBrowserFallback(text, lang) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang === "hi" ? "hi-IN" : "en-IN";
      utter.rate = 0.96;
      window.speechSynthesis.speak(utter);
    }

    async function speakReport() {
      if (!currentSummary) return;
      try {
        const res = await fetch("/api/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: currentSummary, tone: currentTone, language: currentLang })
        });
        const contentType = res.headers.get("Content-Type") || "";
        if (res.ok && contentType.includes("audio/wav")) {
          const blob = await res.blob();
          audioPlayer.pause();
          if (lastAudioUrl) URL.revokeObjectURL(lastAudioUrl);
          lastAudioUrl = URL.createObjectURL(blob);
          audioPlayer.src = lastAudioUrl;
          await audioPlayer.play().catch(() => speakWithBrowserFallback(currentSummary, currentLang));
          return;
        }
      } catch (_) {}
      speakWithBrowserFallback(currentSummary, currentLang);
    }

    window.addEventListener("resize", checkOverflow);
    applyUIStrings();
    startCamera();
  </script>
</body>
</html>
